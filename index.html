<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#F9FAFB" />
    <title>Gemini iOS App</title>
    <!-- Added typography plugin for better Markdown styling -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ios: {
                blue: '#007AFF',
                gray: '#F2F2F7',
                red: '#FF3B30',
                green: '#34C759',
                separator: '#C6C6C8',
                background: '#F9FAFB',
                card: '#FFFFFF'
              }
            },
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
            },
            boxShadow: {
              'ios-card': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
              'ios-nav': '0 -1px 0 0 rgba(0, 0, 0, 0.1)'
            }
          }
        }
      }
    </script>
    <style>
      /* iOS-like scrollbar hiding */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Smooth tapping on mobile */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background-color: #F9FAFB;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Safe Area Utilities */
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 20px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 20px);
      }
      
      /* Markdown Specific Overrides for Mobile */
      .prose pre {
        background-color: #F3F4F6 !important;
        border-radius: 1rem !important;
        color: #1F2937 !important;
        border: 1px solid #E5E7EB;
      }
      .prose code {
        color: #DB2777 !important;
        font-weight: 600;
      }
      .prose code::before, .prose code::after {
        content: "" !important;
      }
    </style>
